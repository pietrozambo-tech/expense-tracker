name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/expense-tracker-prototype-k275ei
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running.
# Pages publishes are production deployments: killing a run mid-publish leaves
# the deployment cancelled on GitHub's side, and because deploy-pages keys a
# deployment by commit SHA, that SHA can then never be deployed again - a
# re-run recreates the same ID and is rejected instantly with "Deployment
# cancelled". Queue behind the running one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # Do NOT add `with: timeout:` here hoping to survive a slow Pages
        # queue - it cannot work. The action hard-caps the input:
        #
        #   const MAX_TIMEOUT = 600000
        #   this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
        #
        # so anything above ten minutes is silently clamped back down. When
        # that limit is hit the action does not merely fail the run, it
        # cancels the deployment, and `deployment_cancelled` is a permanent
        # status keyed by commit SHA - so re-running the same commit dies
        # instantly with "Deployment cancelled". Recovery is a NEW commit
        # (an empty one is enough), never a re-run.
        uses: actions/deploy-pages@v4
