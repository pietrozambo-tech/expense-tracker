name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/expense-tracker-prototype-k275ei
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No concurrency group, deliberately. It existed to keep two deploy-pages
# actions from cancelling each other; nothing in this workflow cancels
# anything anymore, deployment creation is keyed by SHA so parallel runs
# cannot collide, and Pages serializes publishes server-side regardless.
# What the group actually did in practice (2026-08-06): the hour-long watch
# held the lock, so every later run - including the seconds-fast diagnose
# job that exists to be readable during a stall - sat pending behind it.

jobs:
  # Completes in seconds, on purpose: job logs are only downloadable once a
  # job ends, so health facts parked inside the long-running deploy job are
  # unreadable exactly when they are needed. This job is the readable one.
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          date -u

          # Is GitHub itself degraded? The runner can reach the status page
          # (the dev sandbox cannot).
          curl -sS --max-time 10 https://www.githubstatus.com/api/v2/summary.json 2>/dev/null \
            | jq -r '
                (.components[] | select(.name == "Pages" or .name == "Actions")
                  | "githubstatus: \(.name) = \(.status)"),
                (.incidents[] | "githubstatus incident [\(.status)]: \(.name)")
              ' || echo "githubstatus: (unreachable)"

          # build_type must be "workflow" for API deployments to publish at
          # all; "legacy" would mean the site is wired to a branch and every
          # deployment this workflow creates is a no-op.
          gh api "repos/$GITHUB_REPOSITORY/pages" \
            --jq '"site: build_type=\(.build_type) url=\(.html_url)"' \
            || echo "(could not read site config)"

          # Calibration probe: on 2026-08-06 this endpoint reported
          # deployment_in_progress for a SHA that never had a deployment
          # created, so it appears to echo the site's current state rather
          # than answer per-SHA. A garbage SHA settles it: same answer means
          # the endpoint is an echo and per-SHA readings from it are noise.
          s="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployment/status/0000000000000000000000000000000000000000" --jq '.status' 2>/dev/null)" || s="(error)"
          echo "garbage-sha probe: $s"

          # The repo Deployments API is job truth, not publish truth: its
          # statuses are written when the Actions job ends (285a48f read
          # "success at 14:31:07" - the second its watch job completed -
          # while the site demonstrably still served the 12:17 build).
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=12" \
            --jq '.[] | "\(.id) \(.sha[0:7]) created=\(.created_at) ref=\(.ref[0:24])"' \
          | while read -r id sha created ref; do
              latest="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" \
                --jq 'if length == 0 then "(no statuses)" else "\(.[0].state) at \(.[0].created_at)" end' 2>/dev/null)" || latest="(status read failed)"
              echo "$sha $created -> $latest"
            done

          # The only real truth: what the site is serving right now. The
          # entry chunk is content-hashed, and the build stamp inside it is
          # exactly what the app shows in Settings > About.
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url' 2>/dev/null)" || url=""
          if [ -n "$url" ]; then
            served="$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' "${url}index.html?nocache=$(date +%s)" 2>/dev/null \
              | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)" || served=""
            stamp="$(curl -sS --max-time 10 "${url}${served}" 2>/dev/null \
              | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} UTC' | head -1)" || stamp=""
            echo "serving now: ${served:-(unreadable)} build ${stamp:-(unreadable)}"
          fi

  build:
    runs-on: ubuntu-latest
    outputs:
      # Content-hashed entry chunk, e.g. assets/index-Coj-5rhv.js. The
      # deploy job compares this against what the live site references:
      # equality is the one publish signal no API can fake.
      asset: ${{ steps.fingerprint.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - id: fingerprint
        run: echo "asset=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Job-level override: everything the workflow grants, plus actions:write
    # so the unclog step below can cancel the zombie runs from the stall.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time unclogging for the 2026-08-06 stall. Pages publishes
      # serially per site; the pipe has not served anything new since the
      # 12:27 cancel-during-publish race. Cancelling a deployment poisons
      # its SHA forever, which is precisely why these are safe to cancel:
      # every one of them is a superseded build nobody will ever need to
      # publish again. Only this run's own HEAD must stay untouched.
      # Delete this step once the site serves a current build again.
      - name: Cancel superseded deployments jamming the pipe (one-time)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for sha in \
            562677c6231ad83e4e3b11dcdab6ef397b03b1d1 \
            285a48fb10e69fefa4b92ce1e48c361d930a88df \
            848758ff802e8ec5ef9c572e327fa6b24b1f7487 \
            6fed8e418c8d0793356279d35ef00123cc0424a2 \
            e6d452f26e31432e832e09194128aa42f049d3f3 \
            09c9d6b2c94859b96d7be2a872882946e7bc09af \
          ; do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            out="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" 2>&1)" \
              && echo "cancelled ${sha:0:7}" \
              || echo "cancel ${sha:0:7}: $(head -c 120 <<<"$out")"
          done
          # And the zombie runs still holding the old concurrency lock:
          # the pending one would otherwise wake up later and deploy a
          # superseded build on top of ours.
          for run_id in 31111496571 31111648469; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 \
              && echo "cancelled run $run_id" \
              || echo "run $run_id: already finished or cancel failed (fine)"
          done
      # This is what actions/deploy-pages@v4 does on its first two API calls -
      # find the artifact, mint an OIDC token, create the deployment - and then
      # it stops. The action's remaining job is to POLL until Pages reports
      # success, and that polling is what kept breaking this repo:
      #
      #   const MAX_TIMEOUT = 600000
      #   this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
      #
      # The ten-minute limit is hard-capped, so the `timeout` input cannot buy
      # more room. Worse, on timeout the action CANCELS the deployment it just
      # created, and `deployment_cancelled` is permanent and keyed by commit
      # SHA - so that commit can never be published, and even a re-run dies
      # instantly. On 2026-08-06 five consecutive deploys died this way while
      # sitting in `deployment_queued`, purely because the queue was slow.
      #
      # So we create the deployment ourselves and then watch it in a separate
      # step below. That keeps the action's useful half and drops the harmful
      # half: no hard-capped timeout, and nothing ever cancels the deployment.
      #
      # Creating it without watching at all was the first attempt, and it hid a
      # real failure - the run went green at 13:41 on 2026-08-06 while the site
      # stayed on the previous build, because "accepted" is not "published".
      # Hence the watcher: green now means the site is actually live.
      - id: deployment
        name: Queue the Pages deployment (without waiting for it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq 'first(.artifacts[] | select(.name == "github-pages") | .id)')"
          if [ -z "$artifact_id" ]; then
            echo "::error::No 'github-pages' artifact on run $GITHUB_RUN_ID - did the build job upload it?"
            exit 1
          fi

          # Same OIDC token the action requests: default audience, no argument.
          id_token="$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')"
          echo "::add-mask::$id_token"

          # -F sends artifact_id as a number; -f would make it a string and the
          # API rejects it.
          response="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$artifact_id" \
            -f pages_build_version="$GITHUB_SHA" \
            -f oidc_token="$id_token")"

          page_url="$(jq -r '.page_url // empty' <<<"$response")"
          status_url="$(jq -r '.status_url // empty' <<<"$response")"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          echo "Queued Pages deployment for $GITHUB_SHA"
          echo "  site:   $page_url"
          echo "  status: $status_url"

      # Success here means one thing only: the live site references the
      # exact content-hashed bundle this run built. Both status APIs proved
      # unreliable today - pages/deployment/status/{sha} echoes the site's
      # current state for any SHA including garbage, and the Deployments
      # API's statuses mirror Actions job completion, not publication. The
      # served HTML cannot lie. The echo status is still logged, but only
      # as an annotation; it decides nothing.
      - name: Wait until the site actually serves this build
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.deployment.outputs.page_url }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -uo pipefail

          if [ -z "$ASSET" ]; then
            echo "::error::Build job produced no asset fingerprint"
            exit 1
          fi
          echo "waiting for the site to reference: $ASSET"

          deadline=$(( $(date +%s) + 3600 ))
          last=""
          beat=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            served="$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' \
              "${SITE}index.html?nocache=$(date +%s)" 2>/dev/null \
              | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)" || served=""
            if [ "$served" = "$ASSET" ]; then
              stamp="$(curl -sS --max-time 10 "${SITE}${ASSET}" 2>/dev/null \
                | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} UTC' | head -1)" || stamp="?"
              echo "::notice::LIVE: site now serves $ASSET (build $stamp)"
              exit 0
            fi
            echo_status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployment/status/$GITHUB_SHA" \
              --jq '.status' 2>/dev/null)" || echo_status="?"
            line="serving ${served:-(unreadable)} | echo-status $echo_status"
            beat=$((beat + 1))
            # Log every change, plus a heartbeat every ~5 min so a long
            # stretch of silence in this log is never ambiguous.
            if [ "$line" != "$last" ] || [ $((beat % 20)) -eq 0 ]; then
              echo "$(date -u +%H:%M:%S)  $line"
              last="$line"
            fi
            sleep 15
          done
          echo "::warning::After 60 min the site still does not serve $ASSET. The deployment is alive and may still publish - this job does not cancel it."
