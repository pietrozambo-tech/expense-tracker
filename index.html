<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackly</title>
    <meta name="description" content="Trackly — track every expense in seconds with a clean, fast interface built for quick input and clear insights." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F5F7" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%233B82F6'/><stop offset='1' stop-color='%236366F1'/></linearGradient></defs><rect width='48' height='48' rx='13' fill='url(%23g)'/><polyline points='11,31 20,22 27,27 37,14' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><circle cx='37' cy='14' r='3.6' fill='white'/></svg>" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trackly" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* Force portrait, no matter how the phone is held. The manifest locks
         orientation on installed Android; iOS web apps can't lock, so when a
         phone is turned sideways we rotate the whole app back to portrait —
         the vertical layout is preserved, with no landscape reflow and no
         message. Scoped to short viewports (phones in landscape) so tablets
         and desktop are unaffected. */
      @media screen and (orientation: landscape) and (max-height: 500px) {
        html, body { overflow: hidden; }
        #root {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vh;
          height: 100vw;
          transform-origin: top left;
          transform: translateX(100vw) rotate(90deg);
          overflow-y: auto;
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
        }
        /* Full-height containers reference the (short) landscape vh; remap them
           to the portrait height so they fill the rotated frame. */
        #root .min-h-screen { min-height: 100vw; }
        #root .h-screen { height: 100vw; }
        #root [style*="100dvh"] { height: 100vw !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
